# --- Referencing results (installation wizard) ---
REF_NO_REPLY=No response from the robot - the referencing did not run
REF_NO_REPLY_HELP=The robot did not run the referencing program. Check:\n  - Remote Control is enabled (in Local mode the e-Series ignores externally sent scripts).\n  - The arm is powered on and the brakes are released.\n  - No script popup is waiting for confirmation on the teach pendant.\n  - Open the Log tab on the pendant to see script errors.
REF_ERR_1=The probe circle did not cross both beams cleanly (wrong number of edges). Check beam alignment, probe radius and that both sensors trigger.
REF_ERR_2=Could not compute the beam intersection point.
REF_ERR_3=Invalid beam intersection point.
REF_ERR_4=At the cross center the tip is not blocking both beams (input low). Check the taught center and that both beams trigger with the tip in.
REF_ERR_5=Z search failed: the tip never cleared the beam plane. Check the Search Z stroke and the beam height.
REF_ERR_6=TCP correction outside the allowed tolerance.
REF_ERR_7=Tool diameter outside the allowed tolerance.
REF_ERR_11=Angle adjust: wrong number of edges on the probe circle.
REF_ERR_12=Angle adjust: could not compute the intersection point.
REF_ERR_13=Angle adjust: invalid intersection point.
REF_ERR_14=Orientation correction (RX/RY) outside the allowed limit.
REF_ERR_21=Input low at the reference position: the tip is not blocking both beams. Check the taught center / TCP.
REF_ERR_31=Immerse Z failed: the beams were not blocked again on the way back. Check the immerse stroke.
REF_ERR_UNKNOWN=Referencing failed with an unknown status.
REF_ERR_REF_MISSING=The reference TCP is not available (renamed or deleted in the robot's TCP list). Re-select it in Setup.
REF_LOCAL_MODE=The robot is in Local control mode, so it ignores externally sent scripts. Enable Remote Control (top-right menu in PolyScope) and try again.
TEST_MOVE_CENTER=Hold "Move robot to position" until the tool reaches the taught center; the probe starts automatically on arrival.

