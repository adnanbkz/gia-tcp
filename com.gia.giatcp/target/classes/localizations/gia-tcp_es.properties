# --- Resultados de referenciado (asistente de instalación) ---
REF_NO_REPLY=Sin respuesta del robot - el referenciado no llegó a ejecutarse
REF_NO_REPLY_HELP=El robot no ejecutó el programa de referenciado. Comprueba:\n  - Que Remote Control esté activado (en modo Local la e-Series ignora los scripts enviados desde fuera).\n  - Que el brazo esté encendido y los frenos liberados.\n  - Que no haya un popup de script esperando confirmación en el teach pendant.\n  - Abre la pestaña Log del pendant para ver errores de script.
REF_ERR_1=El círculo de sondeo no cruzó las dos barreras limpiamente (número de flancos incorrecto). Revisa la alineación de los haces, el radio de sondeo y que ambos sensores disparen.
REF_ERR_2=No se pudo calcular el punto de intersección de los haces.
REF_ERR_3=Punto de intersección de los haces no válido.
REF_ERR_4=En el centro de la cruz la punta no corta los dos haces (entrada en bajo). Revisa el centro enseñado y que ambos haces disparen con la punta dentro.
REF_ERR_5=Búsqueda Z fallida: la punta nunca salió por debajo del plano del haz. Revisa el recorrido de Búsqueda Z y la altura del haz.
REF_ERR_6=Corrección del TCP fuera de la tolerancia permitida.
REF_ERR_7=Diámetro de la herramienta fuera de la tolerancia permitida.
REF_ERR_11=Ajuste de ángulo: número de flancos incorrecto en el círculo de sondeo.
REF_ERR_12=Ajuste de ángulo: no se pudo calcular el punto de intersección.
REF_ERR_13=Ajuste de ángulo: punto de intersección no válido.
REF_ERR_14=Corrección de orientación (RX/RY) fuera del límite permitido.
REF_ERR_21=Entrada en bajo en la posición de referencia: la punta no corta los dos haces. Revisa el centro enseñado / el TCP.
REF_ERR_31=Inmersión Z fallida: los haces no se volvieron a cortar a la vuelta. Revisa el recorrido de inmersión.
REF_ERR_UNKNOWN=Referenciado fallido con un estado desconocido.
REF_ERR_REF_MISSING=El TCP de referencia no está disponible (renombrado o borrado en la lista de TCP del robot). Vuelve a seleccionarlo en Configurar.
REF_LOCAL_MODE=El robot está en modo de control Local, por lo que ignora los scripts enviados desde fuera. Activa Remote Control (menú arriba a la derecha en PolyScope) y vuelve a intentarlo.
TEST_MOVE_CENTER=Mantén pulsado "Mover robot a posición" hasta que la herramienta llegue al centro enseñado; el sondeo arranca automáticamente al llegar.

